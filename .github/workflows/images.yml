name: images
# core, router and session images to GHCR, tagged sha-<12> and latest. The router image carries the
# app's web export. k8s/ pins the core and router tags (a commit by this workflow), the router is
# told the session image's tag through its deployment.
on:
  push:
    branches: [main]
    paths: [core/**, router/**, machine/**, session-image/**, app/**, .github/workflows/images.yml]
  workflow_dispatch:
permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write
concurrency: { group: images, cancel-in-progress: false }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }
      - run: cd core && go vet ./... && go test ./... && go build -tags fakefly ./...
      - run: cd router && go vet ./... && go test ./...
      - run: cd machine && go vet ./... && go test ./...
  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: core, context: core, file: core/Dockerfile }
          - { name: router, context: ., file: router/Dockerfile }
          - { name: session, context: ., file: session-image/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - name: web export (router image only)
        if: matrix.name == 'router'
        run: |
          mkdir -p web
          if [ -f app/package.json ]; then
            cd app && npm ci --no-audit --no-fund && npx expo export --platform web --output-dir ../web
          else
            echo '<!doctype html><title>Jarvis 2</title><p>Jarvis 2: the web page is not built yet.' > web/index.html
          fi
      - if: matrix.name == 'session'
        name: free disk space (the base image is large)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: tag
        run: echo "sha=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/de0ch/jarvis2-${{ matrix.name }}:${{ steps.tag.outputs.sha }}
            ghcr.io/de0ch/jarvis2-${{ matrix.name }}:latest
      - name: build attestation (what the iPhone will check for "CI build from <date>")
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/de0ch/jarvis2-${{ matrix.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
  pin:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: pin the new tags in k8s/ (Flux rolls them out)
        run: |
          T="sha-${GITHUB_SHA::12}"
          [ -d k8s ] || exit 0
          sed -i -E "s#(ghcr.io/de0ch/jarvis2-(core|router)):sha-[0-9a-f]{12}#\1:$T#g" k8s/*/*.yaml
          sed -i -E "s#(ghcr.io/de0ch/jarvis2-session):sha-[0-9a-f]{12}#\1:$T#g" k8s/*/*.yaml
          git diff --quiet && exit 0
          git config user.name "jarvis2-ci"; git config user.email "ci@jarvis2.invalid"
          git commit -am "images: pin $T [skip ci]"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
