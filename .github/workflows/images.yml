name: images
# core, router and session images to GHCR, tagged sha-<12> and latest. The router image carries the
# app's web export. k8s/ pins the core and router tags (a commit by this workflow), the router is
# told the session image's tag through its deployment.
on:
  push:
    branches: [main]
    paths: [core/**, router/**, machine/**, session-image/**, policy/**, tasks/**, e2e/testdata/**, keys/master.pub, app/**, .github/workflows/images.yml]
  workflow_dispatch:
permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write
concurrency: { group: images, cancel-in-progress: false }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }
      - run: cd core && go vet ./... && go test ./... && go build -tags fakefly ./...
      - run: cd router && go vet ./... && go test ./...
      - run: cd machine && go vet ./... && go test ./...
  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: core, context: core, file: core/Dockerfile }
          - { name: router, context: ., file: router/Dockerfile }
          - { name: session, context: ., file: session-image/Dockerfile, args: "MASTER_PUB=keys/master.pub" }
          # the same image trusting the public TEST master key (e2e/testdata): the end-to-end test only
          - { name: session-test, context: ., file: session-image/Dockerfile, args: "MASTER_PUB=e2e/testdata/master-test.pub" }
    steps:
      - uses: actions/checkout@v4
      - name: web export (router image only)
        if: matrix.name == 'router'
        run: |
          mkdir -p web
          if [ -f app/package.json ]; then
            cd app && npm ci --no-audit --no-fund && npx expo export --platform web --output-dir ../web
          else
            echo '<!doctype html><title>Jarvis 2</title><p>Jarvis 2: the web page is not built yet.' > web/index.html
          fi
      - id: skip
        # the production session image needs the real master key, generated on Deyao's iPhone
        run: if [ "${{ matrix.name }}" = session ] && [ ! -s keys/master.pub ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - if: startsWith(matrix.name, 'session') && !steps.skip.outputs.skip
        name: free disk space (the base image is large)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - if: ${{ !steps.skip.outputs.skip }}
        uses: docker/setup-buildx-action@v3
      - if: ${{ !steps.skip.outputs.skip }}
        uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: tag
        run: echo "sha=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - id: push
        if: ${{ !steps.skip.outputs.skip }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.args }}
          push: true
          tags: |
            ghcr.io/de0ch/jarvis2-${{ matrix.name }}:${{ steps.tag.outputs.sha }}
            ghcr.io/de0ch/jarvis2-${{ matrix.name }}:latest
      - name: build attestation (what the iPhone will check for "CI build from <date>")
        if: ${{ !steps.skip.outputs.skip }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/de0ch/jarvis2-${{ matrix.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
  pin:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }  # the pin checks compare against older commits
      - name: pin the new tags in k8s/ (Flux rolls them out); never over a newer pin
        run: |
          T="sha-${GITHUB_SHA::12}"
          git fetch -q origin main && git reset -q --hard origin/main
          [ -d k8s ] || exit 0
          cur="$(grep -ho 'jarvis2-router:sha-[0-9a-f]*' k8s/apps/router.yaml | head -1 | cut -d- -f3)"
          [ -n "$cur" ] || { echo "k8s/apps/router.yaml pins no router image"; exit 1; }
          if [ -n "$cur" ] && full="$(git rev-parse -q --verify "$cur^{commit}")" && [ "$full" != "$GITHUB_SHA" ] \
             && git merge-base --is-ancestor "$GITHUB_SHA" "$full"; then echo "main already pins a newer build ($cur)"; exit 0; fi
          sed -i -E "s#(ghcr.io/de0ch/jarvis2-router):sha-[0-9a-f]{12}#\1:$T#g" k8s/apps/*.yaml
          # the session image exists only once the real master key is in git
          if [ -s keys/master.pub ]; then sed -i -E "s#(ghcr.io/de0ch/jarvis2-session):sha-[0-9a-f]{12}#\1:$T#g" k8s/apps/*.yaml; fi
          # the core moves ONLY when core/ changed (the CI-only fake and the tests don't count): a core restart is a new controller (Deyao re-pairs, stores
          # are seeded again), so a router or app push must never restart it
          corecur="$(grep -ho 'jarvis2-core:sha-[0-9a-f]*' k8s/apps/core.yaml | cut -d- -f3)"
          if ! corefull="$(git rev-parse -q --verify "$corecur^{commit}")" || ! git diff --quiet "$corefull" "$GITHUB_SHA" -- core/ ':!core/fakefly.go' ':!core/*_test.go'; then
            sed -i -E "s#(ghcr.io/de0ch/jarvis2-core):sha-[0-9a-f]{12}#\1:$T#g" k8s/apps/core.yaml
          fi
          git diff --quiet && exit 0
          git config user.name "jarvis2-ci"; git config user.email "ci@jarvis2.invalid"
          git commit -qam "images: pin $T [skip ci]"
          git push -q origin HEAD:main
