name: ios
# The Jarvis 2 iPhone/iPad app (ios/, native SwiftUI): compile (Release and CI flavours), the app's crypto against the
# kernel's golden vectors and the real secrets binary, the simulator walkthrough against the REAL secrets (fakefly build)
# and router on the runner, and on main a
# TestFlight build (archived unsigned, cloud-signed at export with the App Store Connect API key; lessons/75), gated on
# a passing phone replica of the same app (ios/Jarvis2, ios/project.yml, policy/: what ships; tests may differ).
on:
  push:
    paths: [ios/**, core/**, router/**, tasks/**, infra/setup.py, e2e/testdata/**, policy/**, tools/**, .github/workflows/ios.yml]
  workflow_dispatch:
    inputs:
      only:
        description: "all, or only the TestFlight job (to iterate on signing/upload)"
        type: choice
        options: [all, testflight]
        default: all
      replica_gate:
        description: "the phone replica gate (a passing replica run on this ios/); skip only to ship without it"
        type: choice
        options: [require, skip]
        default: require
concurrency:
  group: ios-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  compile:
    if: inputs.only != 'testflight'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Build, Release and CI flavours (fails in minutes, before the stand-ins)
        working-directory: ios
        run: |
          xcodegen generate
          set -o pipefail
          ok=0
          for f in "" JARVIS_CI; do
            xcodebuild build -project Jarvis2.xcodeproj -scheme Jarvis2 -configuration Release -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath ../dd-$f CODE_SIGNING_ALLOWED=NO JARVIS_CI_FLAG=$f 2>&1 | tee ../build-$f.log | grep -E "error:|warning: .*(deprecated|concurren)|\*\* " || true
            grep -q "BUILD SUCCEEDED" ../build-$f.log || ok=1
          done
          exit $ok
      - if: always()
        run: grep -h "error:" build-*.log | sort -u | head -200 > errors.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: compile, path: "*.txt" }

  standin:
    if: inputs.only != 'testflight'
    # the kernel stand-in the simulator jobs run against (ios/ci/standins.sh, kernel-up.sh: the eight parts, the router,
    # the fake machines, the roster watcher), driven end to end by ios/ci/kernel-smoke.py as the phone: Recover, the
    # roster's phone and root keys, root's grant, New session to started, terminal, add-store, command, pause, resume
    # with a prompt, destroy. Linux, minutes: it fails here before the simulator's hour.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }
      - run: curl -fsSL https://rclone.org/install.sh | sudo bash  # apt's rclone is too old for `serve s3`
      - name: stand-ins, then the phone's flows against them
        run: |
          bash ios/ci/standins.sh "$RUNNER_TEMP/w"
          "$RUNNER_TEMP/w/venv/bin/python" -B ios/ci/kernel-smoke.py "$RUNNER_TEMP/w"
      - if: always()
        run: tail -n 80 "$RUNNER_TEMP"/w/*-standins.log || true

  interop:
    if: inputs.only != 'testflight'
    # Security/CoreCrypto.swift + CoreSetup.swift + SignedAction.swift + Kernel.swift + ApprovalChecks.swift (CryptoKit)
    # against core/kernel/testdata (Golden), the real secrets binary (fakefly, a throwaway box key) and the backups as a
    # real router serves them from a local S3 stand-in seeded by infra/setup.py (Interop)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }
      - name: stand-ins (keys, S3 with seeded backups, core, router)
        run: bash ios/ci/standins.sh "$RUNNER_TEMP/w"
      - name: swift run Units (app code that needs no simulator, e.g. ResumeOnce)
        working-directory: ios/interop
        run: swift run Units
      - name: swift run Golden (the app's reading, checking, rendering and signing against core/kernel/testdata), its signatures opened by the kernel's Go code
        run: |
          (cd ios/interop && GOLDEN_OUT="$RUNNER_TEMP/golden.json" swift run Golden)
          (cd ios/ci/golden-verify && go run . ../../../core/kernel/testdata/keys.json "$RUNNER_TEMP/golden.json")
      - name: swift run Interop
        working-directory: ios/interop
        run: |
          W="$RUNNER_TEMP/w"
          INTEROP_CORE=http://127.0.0.1:8090 INTEROP_ROUTER=http://127.0.0.1:18080 INTEROP_KEYS="$W/keys" INTEROP_BACKUPS="$W/backups.json" \
          INTEROP_MASTER_PEM="$GITHUB_WORKSPACE/e2e/testdata/master-test.pem" INTEROP_EXPORT_OUT="$RUNNER_TEMP/export.json" swift run -c release Interop
      - name: the offline decryptor (tools/decrypt-backup.py) on the file the app's code made, and its own tests
        run: |
          W="$RUNNER_TEMP/w"
          python3 -m venv "$RUNNER_TEMP/venv" && . "$RUNNER_TEMP/venv/bin/activate" && pip install -q cryptography
          python3 tools/decrypt_backup_test.py
          kit="jarvis2-kit:2:$(openssl pkcs8 -topk8 -nocrypt -in e2e/testdata/master-test.pem -outform DER | base64 | tr -d '\n')"
          printf '%s' "$kit" | python3 tools/decrypt-backup.py "$RUNNER_TEMP/export.json" --kit-file - --setup-pub "$W/keys/setup.pub" --out "$RUNNER_TEMP/plain.json"
          python3 - "$RUNNER_TEMP/plain.json" <<'PY'
          import json, os, stat, sys
          d = json.load(open(sys.argv[1]))["stores"]
          assert stat.S_IMODE(os.stat(sys.argv[1]).st_mode) == 0o600
          assert d["default"]["values"] == {"GITHUB_TOKEN": "ci-dummy", "OTHER": "x"} and not d["default"]["sensitive"], d["default"]
          assert d["marked"]["sensitive"] and d["core"]["sensitive"] and d["gmail"]["sensitive"]
          print("ok   the offline copy opens with the test kit:", sorted(d))
          PY
      - if: always()
        run: tail -n 200 "$RUNNER_TEMP"/w/*-standins.log || true

  simulator:
    if: inputs.only != 'testflight'
    needs: compile
    runs-on: xcode-27
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }
      - name: stand-ins (keys + their server, S3 with seeded backups, the core and router binaries)
        run: |
          W="$RUNNER_TEMP/w"
          NO_CORE=1 bash ios/ci/standins.sh "$W"
          mkdir -p out
      - run: brew install xcodegen
      - name: Xcode 27.0 and a booted iPhone 17 (iPhone18,3) on iOS 27.0, as Deyao's phone
        uses: ./.github/actions/ios-simulator
      - name: Stream logs
        run: |
          mkdir -p out
          nohup xcrun simctl spawn "$SIM_UDID" log stream --style compact --level debug --predicate 'process == "Jarvis2"' > out/sim.log 2>&1 &
      - name: A test photo in the simulator's library (the walkthrough attaches it on New session)
        run: python3 ios/ci/test-photo.py "$RUNNER_TEMP/ci-photo.png" && xcrun simctl addmedia "$SIM_UDID" "$RUNNER_TEMP/ci-photo.png"
      - name: Build for testing (the app talks to the router, the key server and the S3 stand-in on the runner)
        working-directory: ios
        run: |
          xcodegen generate
          set -o pipefail
          xcodebuild build-for-testing -project Jarvis2.xcodeproj -scheme Jarvis2 \
            -destination "id=$SIM_UDID" -derivedDataPath ../dd \
            JARVIS_BASE=http://127.0.0.1:18080/ JARVIS_CI_FLAG=JARVIS_CI JARVIS_CI_KEYS_BASE=http://127.0.0.1:18099/ \
            2>&1 | tee ../xcodebuild.log | grep -E "error:|\*\* " || true
          grep -q "TEST BUILD SUCCEEDED" ../xcodebuild.log
      - name: UI test, light then dark (fresh core, router and keychain each time), recorded
        run: |
          W="$RUNNER_TEMP/w"
          # the kit the walkthrough recovers with: the public TEST master key (the stand-in backups are sealed to it)
          kit="jarvis2-kit:2:$(openssl pkcs8 -topk8 -nocrypt -in e2e/testdata/master-test.pem -outform DER | base64 | tr -d '\n')"
          ok=0
          for a in light dark; do
            for try in 1 2; do
              # a fresh kernel (eight parts, secrets again whenever a Reset ends it), router, fake machines and roster
              # watcher (ios/ci/kernel-up.sh), keychain and app for each attempt
              bash ios/ci/kernel-up.sh "$W" "$PWD/out" "$a-$try" "$PWD/data-$a-$try"
              xcrun simctl keychain "$SIM_UDID" reset
              xcrun simctl uninstall "$SIM_UDID" dev.de0ch.jarvis2 || true
              xcrun simctl ui "$SIM_UDID" appearance $a
              sleep 5
              xcrun simctl io "$SIM_UDID" recordVideo --codec=h264 --force out/walkthrough-$a.mov > out/record-$a.log 2>&1 &
              rec=$!
              touch "$RUNNER_TEMP/try-start"
              rm -rf result-$a.xcresult
              (cd ios && TEST_RUNNER_JARVIS2_APPEARANCE=$a TEST_RUNNER_JARVIS2_KIT="$kit" TEST_RUNNER_JARVIS2_SETUP_KEY="$(cat "$W/setup-key.pem")" \
                xcodebuild test-without-building -project Jarvis2.xcodeproj -scheme Jarvis2 \
                -only-testing:Jarvis2UITests/Jarvis2UITests/testWalkthrough \
                -destination "id=$SIM_UDID" -derivedDataPath ../dd \
                -resultBundlePath ../result-$a.xcresult 2>&1 | tee ../test-$a.log | grep -E "error:|Test Case|\*\* " || true)
              kill -INT $rec; wait $rec || true
              grep -q "TEST EXECUTE SUCCEEDED\|\*\* TEST SUCCEEDED" test-$a.log && break
              # retried once, from scratch, only for the simulator's own faults: a launch timeout, XCTest timing out reading the app, or it
              # crashed inside Apple's accessibility code alone (ios/ci/apple-crash.py)
              if grep -q "Failed to launch\|Timed out while evaluating UI query" test-$a.log; then echo "simulator timed out ($a): once more"
              elif python3 ios/ci/apple-crash.py "$RUNNER_TEMP/try-start"; then echo "the simulator crashed the app in Apple's code ($a): once more"
              else break; fi
              cp test-$a.log out/test-$a-try$try.log
              xcrun simctl terminate "$SIM_UDID" dev.de0ch.jarvis2 || true; sleep 10
            done
            grep -q "TEST EXECUTE SUCCEEDED\|\*\* TEST SUCCEEDED" test-$a.log || ok=1
          done
          exit $ok
      - name: Export results
        if: always()
        run: |
          for a in light dark; do mkdir -p out/$a; xcrun xcresulttool export attachments --path result-$a.xcresult --output-path out/$a || true; done
          cat test-*.log > out/test.log 2>/dev/null || true
          tail -c 300000 xcodebuild.log > out/xcodebuild-tail.log || true
          grep -n "error:" xcodebuild.log | head -100 > out/errors.txt || true
          cp "$RUNNER_TEMP/w/"*.log out/ 2>/dev/null || true
          mkdir -p out/crash
          find ~/Library/Logs/DiagnosticReports -newer ios/project.yml -name "*.ips" -exec cp {} out/crash/ \; 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: results, path: out }

  testflight:
    # main only, after the walkthrough and the interop test pass, and only for an ios/ the phone replica passed on
    if: >-
      always() && github.ref == 'refs/heads/main' && (inputs.only == 'testflight' ||
      (needs.simulator.result == 'success' && needs.interop.result == 'success'))
    needs: [simulator, interop]
    runs-on: macos-26
    environment: release
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: The phone replica gate (infra/phone-replica.sh passed on this very ios/)
        if: inputs.replica_gate != 'skip'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in $(gh run list -R "$GITHUB_REPOSITORY" -w replica.yml -s success -L 30 --json headSha -q '.[].headSha'); do
            if git cat-file -e "$sha^{commit}" 2>/dev/null && git diff --quiet "$sha" "$GITHUB_SHA" -- ios/Jarvis2 ios/project.yml policy/; then
              echo "the replica passed on $sha (the same app: ios/Jarvis2, ios/project.yml, policy/)"; exit 0
            fi
          done
          echo "::error::no passing phone replica for this ios/: run infra/phone-replica.sh, then this workflow with only=testflight"
          exit 1
      - run: brew install xcodegen
      - name: API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: mkdir -p ~/.asc && printf '%s\n' "$ASC_PRIVATE_KEY" > ~/.asc/AuthKey.p8 && chmod 600 ~/.asc/AuthKey.p8
      - name: Archive (unsigned; the export signs with Apple's cloud-managed distribution certificate)
        working-directory: ios
        run: |
          xcodegen generate
          set -o pipefail
          # signing at archive time would mint a development certificate on every runner (lessons/75)
          xcodebuild archive -project Jarvis2.xcodeproj -scheme Jarvis2 -configuration Release \
            -destination 'generic/platform=iOS' -archivePath ../Jarvis2.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM=S64YL394S3 \
            CURRENT_PROJECT_VERSION=$(( ${{ github.run_number }} + 1000 )) 2>&1 | tee ../archive.log | grep -E "error:|warning: .*sign|\*\* " || true
          grep -q "ARCHIVE SUCCEEDED" ../archive.log
          # a release build never carries the CI stand-in's address or another keys ref
          for k in JarvisCIKeysBase JarvisKeysRef; do
            v=$(/usr/libexec/PlistBuddy -c "Print :$k" ../Jarvis2.xcarchive/Products/Applications/Jarvis2.app/Info.plist 2>/dev/null || true)
            [ -z "$v" ] || { echo "release Info.plist has $k=$v"; exit 1; }
          done
          # and the pinned harness policy is git's
          cmp ../Jarvis2.xcarchive/Products/Applications/Jarvis2.app/stores.json ../policy/stores.json
      - name: Export + upload to App Store Connect
        run: |
          cat > ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>S64YL394S3</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive -archivePath Jarvis2.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath export \
            -allowProvisioningUpdates -authenticationKeyPath ~/.asc/AuthKey.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee export.log | tail -30
          grep -q "EXPORT SUCCEEDED\|Upload succeeded" export.log
      - name: logs
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: testflight-logs, path: "*.log" }
