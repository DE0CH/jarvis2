name: app
# The Jarvis 2 app (app/): the web export, the shell's crypto against the real core, the iOS app on a
# simulator walked end to end against the REAL core (fakefly build) and router running on the runner,
# and — on main — a TestFlight build (cloud-signed with the App Store Connect API key).
on:
  push:
    paths: [app/**, core/**, router/**, tasks/**, infra/setup.py, e2e/testdata/**, policy/**, .github/workflows/app.yml]
  workflow_dispatch:
    inputs:
      only:
        description: "all, or only the TestFlight job (to iterate on signing/upload)"
        type: choice
        options: [all, testflight]
        default: all
concurrency:
  group: app-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  web:
    if: inputs.only != 'testflight'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: typecheck + web export (the router serves ../web at /)
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npx expo export --platform web --output-dir ../web
      - uses: actions/upload-artifact@v4
        with: { name: web, path: web }

  interop:
    if: inputs.only != 'testflight'
    # Shell/CoreCrypto.swift + Shell/Recovery.swift (CryptoKit) against the real Go core (fakefly, the public
    # TEST master key, a throwaway box key) and backups on a local S3 stand-in (rclone serve s3, which checks
    # SigV4) seeded by infra/setup.py's own code: identity + words, the sealed read keys, the recovery kit string,
    # backups, recovery from the kit, stores,
    # unlock, approvals, refusals
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }
      - name: stand-ins (keys, S3 with seeded backups, core)
        run: bash app/ios/ci/standins.sh "$RUNNER_TEMP/w"
      - name: swift run Interop
        working-directory: app/ios/interop
        run: |
          W="$RUNNER_TEMP/w"
          INTEROP_CORE=http://127.0.0.1:8090 INTEROP_S3_ENDPOINT=http://127.0.0.1:18098 INTEROP_S3_ENV="$W/s3.env" INTEROP_RECOVERY_KEYS="$W/recovery-keys.json" \
          INTEROP_KEYS="$W/keys" INTEROP_WORDS="$GITHUB_WORKSPACE/core/words.txt" INTEROP_WORDS_EXPECTED="$(cat "$W/words")" \
          INTEROP_MASTER_PEM="$GITHUB_WORKSPACE/e2e/testdata/master-test.pem" swift run -c release Interop
      - if: always()
        run: cat "$RUNNER_TEMP/w/core.log" || true

  simulator:
    if: inputs.only != 'testflight'
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }
      - name: typecheck the shell first (fails in a minute, not after the pods build) — release and CI flavours
        working-directory: app/ios
        run: |
          for d in "" "-D JARVIS_CI"; do
            xcrun -sdk iphonesimulator swiftc -typecheck -parse-as-library -swift-version 5 $d \
              -target arm64-apple-ios26.0-simulator Shell/*.swift Shared/*.swift
          done
      - name: stand-ins (keys + their server, S3 with seeded backups) and the router
        run: |
          W="$RUNNER_TEMP/w"
          NO_CORE=1 bash app/ios/ci/standins.sh "$W"
          mkdir -p out
          (cd router && go build -o "$W/router" .)
          # the test policy: the claude harness brings claude-login (hidden in the app's pickers)
          echo '{"harnesses":{"claude":{"stores":["claude-login"]},"opencode":{"stores":[]}}}' > "$W/policy.json"
      - name: Install
        working-directory: app
        run: npm ci --no-audit --no-fund
      - name: JS bundle (runs inside the extension)
        working-directory: app
        run: |
          mkdir -p ios/Extension/res
          npx expo export:embed --platform ios --dev false --entry-file node_modules/expo-router/entry.js \
            --bundle-output ios/Extension/main.jsbundle --assets-dest ios/Extension/res
          mkdir -p ios/Extension/res/assets && ls -la ios/Extension/main.jsbundle
      - run: brew install xcodegen
      - name: Generate project + pods
        working-directory: app/ios
        run: xcodegen generate && pod install
      - name: Boot simulator + stream logs
        run: |
          xcrun simctl boot "iPhone 17" || true
          xcrun simctl bootstatus "iPhone 17" -b
          nohup xcrun simctl spawn "iPhone 17" log stream --style compact --level debug \
            --predicate 'process == "JarvisUI" OR process == "Jarvis2"' > out/sim.log 2>&1 &
      - name: Build for testing (the shell talks to the router, the key server and the S3 stand-in on the runner)
        working-directory: app/ios
        run: |
          set -o pipefail
          xcodebuild build-for-testing -workspace Jarvis2.xcworkspace -scheme Jarvis2 \
            -destination 'platform=iOS Simulator,name=iPhone 17' -derivedDataPath ../../dd \
            JARVIS_BASE=http://127.0.0.1:18080/ JARVIS_CI_FLAG=JARVIS_CI JARVIS_CI_KEYS_BASE=http://127.0.0.1:18099/ \
            JARVIS_CI_BACKUP_ENDPOINT=http://127.0.0.1:18098 JARVIS_CI_BACKUP_BUCKET=jarvis2-backup-ci \
            2>&1 | tee ../../xcodebuild.log | grep -E "error:|\*\* " || true
          grep -q "TEST BUILD SUCCEEDED" ../../xcodebuild.log
      - name: UI test, light then dark (fresh core, router and keychain each time)
        run: |
          W="$RUNNER_TEMP/w"
          ok=0
          for a in light dark; do
            kill $(cat "$W/core.pid" "$W/router.pid" 2>/dev/null) 2>/dev/null || true; sleep 1
            rm -rf data-$a && mkdir -p data-$a
            (MASTER_KEY="$(cat e2e/testdata/master-test.pub)" BOX_KEY_FILE="$W/box-key.pem" ADDR=127.0.0.1:8090 nohup "$W/core" > out/core-$a.log 2>&1 & echo $! > "$W/core.pid")
            for i in $(seq 30); do curl -sf http://127.0.0.1:8090/key > /dev/null && break; sleep 1; done
            words=$(sed -n 's/.*core up; identity //p' out/core-$a.log)
            echo "core words ($a): $words"
            (NO_ACCESS=1 SETUP_KEY="$(cat "$W/keys/setup.pub")" CORE_URL=http://127.0.0.1:8090 DATA_DIR=$PWD/data-$a WEB_DIR=$PWD/web TASKS_DIR=$PWD/tasks SNAPSHOT_WAIT_SECONDS=2 POLICY_FILE="$W/policy.json" \
              SESSION_IMAGE=ghcr.io/de0ch/jarvis2-session:ci ADDR=127.0.0.1:18080 MACHINE_ADDR=127.0.0.1:18081 nohup "$W/router" > out/router-$a.log 2>&1 & echo $! > "$W/router.pid")
            sleep 2 && curl -sf http://127.0.0.1:18080/api/state > /dev/null && echo "router up ($a)"
            # the setup session's step: the bucket's read keys sealed to the (test) master key, through the router
            JARVIS2_URL=http://127.0.0.1:18080 JARVIS2_SETUP_KEY="$(cat "$W/setup-key.pem")" JARVIS2_SETUP_ACCESS_ID=ci JARVIS2_SETUP_ACCESS_SECRET=ci \
              JARVIS2_KEYS_DIR="$W/keys" JARVIS2_BACKUP_BUCKET=jarvis2-backup-ci "$W/venv/bin/python" infra/setup.py recovery-keys "$W/s3.env" --credential=ci-read
            xcrun simctl keychain "iPhone 17" reset
            xcrun simctl uninstall "iPhone 17" dev.de0ch.jarvis2 || true
            xcrun simctl ui "iPhone 17" appearance $a
            (cd app/ios && TEST_RUNNER_JARVIS2_APPEARANCE=$a TEST_RUNNER_JARVIS2_WORDS="$words" \
              TEST_RUNNER_JARVIS2_MASTER_KEY="$(cat "$W/master.kit")" \
              xcodebuild test-without-building -workspace Jarvis2.xcworkspace -scheme Jarvis2 \
              -destination 'platform=iOS Simulator,name=iPhone 17' -derivedDataPath ../../dd \
              -resultBundlePath ../../result-$a.xcresult 2>&1 | tee ../../test-$a.log | grep -E "error:|Test Case|\*\* " || true)
            grep -q "TEST EXECUTE SUCCEEDED\|\*\* TEST SUCCEEDED" test-$a.log || ok=1
          done
          exit $ok
      - name: Export results
        if: always()
        run: |
          for a in light dark; do mkdir -p out/$a; xcrun xcresulttool export attachments --path result-$a.xcresult --output-path out/$a || true; done
          cat test-*.log > out/test.log 2>/dev/null || true
          tail -c 300000 xcodebuild.log > out/xcodebuild-tail.log || true
          grep -n "error:" xcodebuild.log | head -100 > out/errors.txt || true
          cp "$RUNNER_TEMP/w/"*.log out/ 2>/dev/null || true
          mkdir -p out/crash
          find ~/Library/Logs/DiagnosticReports -newer app/package.json -name "*.ips" -exec cp {} out/crash/ \; 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: results, path: out }

  testflight:
    # main only, after the walkthrough and the interop test pass: archive (cloud signing with the ASC API
    # key), upload; the internal group "Owner" (all builds) gets it once Apple has processed it
    if: >-
      always() && github.ref == 'refs/heads/main' && (inputs.only == 'testflight' ||
      (needs.simulator.result == 'success' && needs.interop.result == 'success' && needs.web.result == 'success'))
    needs: [simulator, interop, web]
    runs-on: macos-26
    timeout-minutes: 120
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install + JS bundle
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          mkdir -p ios/Extension/res
          npx expo export:embed --platform ios --dev false --entry-file node_modules/expo-router/entry.js \
            --bundle-output ios/Extension/main.jsbundle --assets-dest ios/Extension/res
          mkdir -p ios/Extension/res/assets
      - run: brew install xcodegen
      - name: Generate project + pods
        working-directory: app/ios
        run: xcodegen generate && pod install
      - name: API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.asc && printf '%s\n' "$ASC_PRIVATE_KEY" > ~/.asc/AuthKey.p8 && chmod 600 ~/.asc/AuthKey.p8
      - name: Archive (unsigned; the export signs with Apple's cloud-managed distribution certificate)
        working-directory: app/ios
        run: |
          set -o pipefail
          # signing at archive time would mint a new development certificate on every runner (the team's
          # limit is reached), so the archive stays unsigned and the export below signs it in the cloud
          xcodebuild archive -workspace Jarvis2.xcworkspace -scheme Jarvis2 -configuration Release \
            -destination 'generic/platform=iOS' -archivePath ../../Jarvis2.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM=S64YL394S3 \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} 2>&1 | tee ../../archive.log | grep -E "error:|warning: .*sign|\*\* " || true
          grep -q "ARCHIVE SUCCEEDED" ../../archive.log
          # a release build never carries the CI stand-ins' addresses (KeySource.swift reads them only when
          # compiled with JARVIS_CI, which this archive isn't)
          for k in JarvisCIKeysBase JarvisCIBackupEndpoint JarvisCIBackupBucket; do
            v=$(/usr/libexec/PlistBuddy -c "Print :$k" ../../Jarvis2.xcarchive/Products/Applications/Jarvis2.app/Info.plist 2>/dev/null || true)
            [ -z "$v" ] || { echo "release Info.plist has $k=$v"; exit 1; }
          done
      - name: Export + upload to App Store Connect
        run: |
          cat > ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>S64YL394S3</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          set -o pipefail
          xcodebuild -exportArchive -archivePath Jarvis2.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath export \
            -allowProvisioningUpdates -authenticationKeyPath ~/.asc/AuthKey.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee export.log | tail -30
          grep -q "EXPORT SUCCEEDED\|Upload succeeded" export.log
      - name: logs
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: testflight-logs, path: "*.log" }
