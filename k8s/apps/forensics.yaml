# ONE-OFF (2026-10-15): capture the evidence of the 02:40 UTC search outage before it expires (k8s events live ~1h;
# a container's previous log and lastState go when its pod is replaced). Read-only: events, pod statuses and the
# previous/current logs of restarted containers in the three namespaces, as one tarball PUT to a presigned S3 URL
# (write-only, that one key, expires 04:50 UTC). Removed again once the bundle is read.
apiVersion: v1
kind: ServiceAccount
metadata: { name: forensics, namespace: jarvis2-edge }
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: forensics-read, namespace: jarvis2-edge }
rules: [{ apiGroups: [""], resources: [pods, pods/log, events], verbs: [get, list] }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: forensics-read, namespace: jarvis2-router }
rules: [{ apiGroups: [""], resources: [pods, pods/log, events], verbs: [get, list] }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: forensics-read, namespace: jarvis2-core }
rules: [{ apiGroups: [""], resources: [pods, events], verbs: [get, list] }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: forensics-read, namespace: jarvis2-edge }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: forensics-read }
subjects: [{ kind: ServiceAccount, name: forensics, namespace: jarvis2-edge }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: forensics-read, namespace: jarvis2-router }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: forensics-read }
subjects: [{ kind: ServiceAccount, name: forensics, namespace: jarvis2-edge }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: forensics-read, namespace: jarvis2-core }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: forensics-read }
subjects: [{ kind: ServiceAccount, name: forensics, namespace: jarvis2-edge }]
---
apiVersion: batch/v1
kind: Job
metadata: { name: forensics-20261015c, namespace: jarvis2-edge }
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    spec:
      serviceAccountName: forensics
      automountServiceAccountToken: true
      restartPolicy: Never
      enableServiceLinks: false
      containers:
        - name: dump
          # the search image (already on the box): node, no dependencies, k8s API over HTTPS with the pod's token
          image: ghcr.io/de0ch/jarvis2-search:sha-0197be05ada4@sha256:6e8ffcf7a3d355a22f9b48524b07f018cd0b1819e780f155fa619b8702e07995
          env: [{ name: PUT_URL, value: "https://fsn1.your-objectstorage.com/de0ch-claude-6fdff6/forensics/2026-10-15-search-outage-20d2b17b03019941.tar.gz?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=19PFHRXEKVHHPJIG46HH%2F20261015%2Ffsn1%2Fs3%2Faws4_request&X-Amz-Date=20261015T031347Z&X-Amz-Expires=7200&X-Amz-SignedHeaders=host&X-Amz-Signature=1cea399899859492eccc73baacf4fe1d0f7b330379226bba3fa4cbfe582caecd" }]
          command: [node, -e]
          args:
            - |
              // one-off: events, pods, pod metrics and logs of the three namespaces -> one JSON, PUT to $PUT_URL
              const fs = require("fs"), https = require("https"), zlib = require("zlib");
              const SA = "/var/run/secrets/kubernetes.io/serviceaccount", token = fs.readFileSync(SA + "/token", "utf8").trim(), ca = fs.readFileSync(SA + "/ca.crt");
              const get = (p) => new Promise((res) => { const r = https.request({ host: process.env.KUBERNETES_SERVICE_HOST, port: process.env.KUBERNETES_SERVICE_PORT, path: p, ca, headers: { Authorization: "Bearer " + token }, timeout: 20000 }, (s) => { let b = ""; s.setEncoding("utf8"); s.on("data", (c) => (b += c)); s.on("end", () => res({ status: s.statusCode, body: b })); }); r.on("timeout", () => r.destroy(new Error("timeout"))); r.on("error", (e) => res({ status: 0, body: String(e) })); r.end(); });
              const j = (x) => { try { return JSON.parse(x.body); } catch { return x.body; } };
              (async () => {
                const out = { takenAt: new Date().toISOString(), ns: {} };
                for (const ns of ["jarvis2-edge", "jarvis2-router", "jarvis2-core"]) {
                  const o = (out.ns[ns] = {});
                  const ev = j(await get(`/api/v1/namespaces/${ns}/events`));
                  o.events = ev.items ? ev.items.map((e) => ({ t: e.lastTimestamp || e.eventTime || e.firstTimestamp, first: e.firstTimestamp, count: e.count, type: e.type, reason: e.reason, obj: `${e.involvedObject.kind}/${e.involvedObject.name}`, msg: e.message })).sort((a, b) => String(a.t).localeCompare(String(b.t))) : ev;
                  const pods = j(await get(`/api/v1/namespaces/${ns}/pods`));
                  o.pods = pods.items ? pods.items.map((p) => ({ name: p.metadata.name, created: p.metadata.creationTimestamp, phase: p.status.phase, reason: p.status.reason, message: p.status.message, conditions: p.status.conditions, containers: (p.status.containerStatuses || []).map((c) => ({ name: c.name, image: c.image, ready: c.ready, restarts: c.restartCount, state: c.state, lastState: c.lastState })), limits: p.spec.containers.map((c) => ({ name: c.name, resources: c.resources })) })) : pods;
                  o.metrics = j(await get(`/apis/metrics.k8s.io/v1beta1/namespaces/${ns}/pods`));
                  if (ns === "jarvis2-core" || !pods.items) continue;
                  o.logs = {};
                  for (const p of pods.items) for (const c of p.status.containerStatuses || []) {
                    const base = `/api/v1/namespaces/${ns}/pods/${p.metadata.name}/log?container=${c.name}&timestamps=true`;
                    const keep = /^(search|cloudflared|watch)/.test(p.metadata.name) || c.restartCount > 0;
                    if (!keep) continue;
                    o.logs[`${p.metadata.name}/${c.name}`] = { current: (await get(base + "&tailLines=400")).body.slice(-120000), previous: c.restartCount > 0 ? (await get(base + "&previous=true&tailLines=600")).body.slice(-150000) : null };
                  }
                }
                const body = zlib.gzipSync(JSON.stringify(out));
                const u = new URL(process.env.PUT_URL);
                await new Promise((res, rej) => { const r = https.request({ host: u.host, path: u.pathname + u.search, method: "PUT", headers: { "Content-Length": body.length } }, (s) => { console.log("PUT", s.statusCode); s.resume(); s.on("end", res); }); r.on("error", rej); r.end(body); });
              })().catch((e) => { console.error(e); process.exit(1); });
          resources: { requests: { cpu: 10m, memory: 64Mi }, limits: { memory: 256Mi } }
          securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] }, seccompProfile: { type: RuntimeDefault } }
