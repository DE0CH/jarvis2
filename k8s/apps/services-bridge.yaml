# The old box only, until the move (docs/RUNBOOK.md "Moving to the two boxes"): transcript search, the watch runner and
# the iCloud index now run on the services box (k8s/services); these pods keep the old in-cluster names the running
# router calls (search/watch/icloud-index.jarvis2-edge:8090/8095/8091) and pass each connection on to the services
# box's NodePorts over the Hetzner Network, so moving the services needs no router restart. Tiny (socat), two each.
# Gone with the old box.
apiVersion: apps/v1
kind: Deployment
metadata: { name: bridge-search, namespace: jarvis2-edge }
spec:
  replicas: 2
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: search, bridge: "1" } }
  template:
    metadata: { labels: { app: search, bridge: "1" } }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: bridge
          image: docker.io/alpine/socat:1.8.1.1@sha256:1d5bf74274add851167dbda0c67d6fabb7772f5b4bc9bc02beca3e12a1071f74
          args: [TCP-LISTEN:8090,fork,reuseaddr, "TCP:10.77.0.3:30090"]
          ports: [{ containerPort: 8090 }]
          readinessProbe: { tcpSocket: { port: 8090 }, periodSeconds: 5 }
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { cpu: 200m, memory: 64Mi } }
          securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] }, seccompProfile: { type: RuntimeDefault } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: bridge-watch, namespace: jarvis2-edge }
spec:
  replicas: 2
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: watch, bridge: "1" } }
  template:
    metadata: { labels: { app: watch, bridge: "1" } }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 130
      containers:
        - name: bridge
          image: docker.io/alpine/socat:1.8.1.1@sha256:1d5bf74274add851167dbda0c67d6fabb7772f5b4bc9bc02beca3e12a1071f74
          args: [TCP-LISTEN:8095,fork,reuseaddr, "TCP:10.77.0.3:30095"]
          ports: [{ containerPort: 8095 }]
          readinessProbe: { tcpSocket: { port: 8095 }, periodSeconds: 5 }
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { cpu: 200m, memory: 64Mi } }
          securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] }, seccompProfile: { type: RuntimeDefault } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: bridge-icloud-index, namespace: jarvis2-edge }
spec:
  replicas: 2
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: icloud-index, bridge: "1" } }
  template:
    metadata: { labels: { app: icloud-index, bridge: "1" } }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: bridge
          image: docker.io/alpine/socat:1.8.1.1@sha256:1d5bf74274add851167dbda0c67d6fabb7772f5b4bc9bc02beca3e12a1071f74
          args: [TCP-LISTEN:8091,fork,reuseaddr, "TCP:10.77.0.3:30091"]
          ports: [{ containerPort: 8091 }]
          readinessProbe: { tcpSocket: { port: 8091 }, periodSeconds: 5 }
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { cpu: 200m, memory: 64Mi } }
          securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] }, seccompProfile: { type: RuntimeDefault } }
---
# the router reaches the bridges (same as the services they stand in for); the bridges reach only the services box
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: bridge, namespace: jarvis2-edge }
spec:
  podSelector: { matchLabels: { bridge: "1" } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { jarvis2/ns: router } }, podSelector: { matchLabels: { app: router } } }]
      ports: [{ port: 8090 }, { port: 8091 }, { port: 8095 }]
  egress:
    - to: [{ ipBlock: { cidr: 10.77.0.3/32 } }]
      ports: [{ port: 30090 }, { port: 30091 }, { port: 30095 }]
