# cloudflared: the remotely managed tunnel jarvis2 (its ingress rules live in Cloudflare: jarvis2.deyaochen.com
# → the router). Its token is the tunnel-token Secret made by infra/cloud-init.sh.
apiVersion: apps/v1
kind: Deployment
metadata: { name: cloudflared, namespace: jarvis2-edge }
spec:
  replicas: 1
  selector: { matchLabels: { app: cloudflared } }
  template:
    metadata: { labels: { app: cloudflared } }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
          args: [tunnel, --no-autoupdate, --metrics, "0.0.0.0:2000", run]
          env: [{ name: TUNNEL_TOKEN, valueFrom: { secretKeyRef: { name: tunnel-token, key: token } } }]
          resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 256Mi } }
          securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] }, seccompProfile: { type: RuntimeDefault } }
