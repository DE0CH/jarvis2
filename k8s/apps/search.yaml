# The old box only, until the move: search runs on the services box (k8s/services/apps/search); this Service keeps
# the in-cluster name the old router calls, answered by its socat bridge (services-bridge.yaml).
apiVersion: v1
kind: PersistentVolumeClaim
# never pruned by Flux: a commit that drops this file by mistake must not delete the index (2026-10-13: one did)
metadata: { name: search-data, namespace: jarvis2-edge, annotations: { kustomize.toolkit.fluxcd.io/prune: disabled } }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 8Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: search, namespace: jarvis2-edge }
spec:
  selector: { app: search }
  ports: [{ port: 8090, targetPort: 8090 }]