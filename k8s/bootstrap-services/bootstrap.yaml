# The SERVICES box's bootstrap (docs/DESIGN.md "The boxes"): applied ONCE by infra/cloud-init.sh (BOX_KIND=services)
# with the node's admin kubeconfig; NOT reconciled by Flux. Namespaces (Pod Security "restricted"), the limited
# identity Flux applies everything else with (admin inside these namespaces only, nothing cluster-scoped), and a
# ResourceQuota per namespace that Flux's `admin` role can read but not change, so a push can't give an experiment
# more of the box than this file does.
apiVersion: v1
kind: Namespace
metadata:
  name: jarvis2-services
  labels: { pod-security.kubernetes.io/enforce: restricted, jarvis2/ns: services }
---
apiVersion: v1
kind: Namespace
metadata:
  name: jarvis2-poc
  labels: { pod-security.kubernetes.io/enforce: restricted, jarvis2/ns: poc }
---
# only a Secret: the Grafana Cloud write token the host's Alloy reads (infra/alloy/, k8s/services/secrets/alloy.enc.yaml)
apiVersion: v1
kind: Namespace
metadata:
  name: jarvis2-obs
  labels: { pod-security.kubernetes.io/enforce: restricted, jarvis2/ns: obs }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: flux-applier, namespace: flux-system }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: flux-applier, namespace: jarvis2-services }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: admin }
subjects: [{ kind: ServiceAccount, name: flux-applier, namespace: flux-system }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: flux-applier, namespace: jarvis2-poc }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: admin }
subjects: [{ kind: ServiceAccount, name: flux-applier, namespace: flux-system }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: flux-applier, namespace: jarvis2-obs }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: admin }
subjects: [{ kind: ServiceAccount, name: flux-applier, namespace: flux-system }]
---
# search 2 × 448 Mi, watch 2 × 192 Mi, the iCloud index 2 × 2 Gi, rolling surges included (+1 of each)
apiVersion: v1
kind: ResourceQuota
metadata: { name: services, namespace: jarvis2-services }
spec:
  hard: { limits.memory: 9Gi, requests.memory: 3Gi, limits.cpu: "6", persistentvolumeclaims: "4", requests.storage: 60Gi }
---
# experiments: whatever they are, never more than 1.5 GiB and one core of the box
apiVersion: v1
kind: ResourceQuota
metadata: { name: poc, namespace: jarvis2-poc }
spec:
  hard: { limits.memory: 1536Mi, requests.memory: 1536Mi, limits.cpu: "1", persistentvolumeclaims: "2", requests.storage: 10Gi }
---
apiVersion: v1
kind: ResourceQuota
metadata: { name: obs, namespace: jarvis2-obs }
spec:
  hard: { pods: "0" }
---
# search reads its own pod's restarts (GET /api/search/status). In the bootstrap, not k8s/services: Flux's dry-run of a
# RoleBinding to a Role made in the same apply is refused (the RBAC escalation check needs the Role to exist), which
# blocked every rollout for 40 min on 2026-10-15.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: search-self, namespace: jarvis2-services }
rules: [{ apiGroups: [""], resources: [pods], verbs: [get] }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: search-self, namespace: jarvis2-services }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: search-self }
subjects: [{ kind: ServiceAccount, name: search, namespace: jarvis2-services }]
