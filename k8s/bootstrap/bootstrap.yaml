# Applied ONCE by infra/cloud-init.sh with the node's admin kubeconfig; NOT reconciled by Flux. Namespaces
# (Pod Security "restricted") and the limited identity Flux applies everything else with: admin inside the
# three Jarvis 2 namespaces only, nothing cluster-scoped, so a push to k8s/apps can't grant itself more.
apiVersion: v1
kind: Namespace
metadata:
  name: jarvis2-core
  labels: { pod-security.kubernetes.io/enforce: restricted, jarvis2/ns: core }
---
apiVersion: v1
kind: Namespace
metadata:
  name: jarvis2-router
  labels: { pod-security.kubernetes.io/enforce: restricted, jarvis2/ns: router }
---
apiVersion: v1
kind: Namespace
metadata:
  name: jarvis2-edge
  labels: { pod-security.kubernetes.io/enforce: restricted, jarvis2/ns: edge }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: flux-applier, namespace: flux-system }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: flux-applier, namespace: jarvis2-core }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: admin }
subjects: [{ kind: ServiceAccount, name: flux-applier, namespace: flux-system }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: flux-applier, namespace: jarvis2-router }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: admin }
subjects: [{ kind: ServiceAccount, name: flux-applier, namespace: flux-system }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: flux-applier, namespace: jarvis2-edge }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: admin }
subjects: [{ kind: ServiceAccount, name: flux-applier, namespace: flux-system }]
---
# search reads its own pod's restarts (k8s/apps/search.yaml). In the bootstrap: a fresh box's Flux refuses a RoleBinding
# to a Role made in the same apply (the RBAC escalation check needs the Role to exist), so k8s/apps can't carry it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: search-self, namespace: jarvis2-edge }
rules: [{ apiGroups: [""], resources: [pods], verbs: [get] }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: search-self, namespace: jarvis2-edge }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: search-self }
subjects: [{ kind: ServiceAccount, name: search, namespace: jarvis2-edge }]
