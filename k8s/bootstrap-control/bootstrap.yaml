# The CONTROL box's bootstrap (docs/DESIGN.md "The boxes"): applied ONCE by infra/cloud-init.sh (BOX_KIND=control)
# with the node's admin kubeconfig; NOT reconciled by Flux. Namespaces (Pod Security "restricted"), the limited identity
# Flux applies everything else with (admin inside these namespaces only, nothing cluster-scoped), the control plane's
# PriorityClass, and a ResourceQuota per namespace that Flux's `admin` role can read but not change: the control box
# runs the control plane and nothing else (Deyao, 2026-10-15: an unimportant job must never bring it down), and a push
# can't schedule more onto it than these quotas allow.
apiVersion: v1
kind: Namespace
metadata:
  name: jarvis2-core
  labels: { pod-security.kubernetes.io/enforce: restricted, jarvis2/ns: core }
---
apiVersion: v1
kind: Namespace
metadata:
  name: jarvis2-kernel
  labels: { pod-security.kubernetes.io/enforce: restricted, jarvis2/ns: kernel }
---
apiVersion: v1
kind: Namespace
metadata:
  name: jarvis2-router
  labels: { pod-security.kubernetes.io/enforce: restricted, jarvis2/ns: router }
---
apiVersion: v1
kind: Namespace
metadata:
  name: jarvis2-edge
  labels: { pod-security.kubernetes.io/enforce: restricted, jarvis2/ns: edge }
---
# only a Secret: the Grafana Cloud write token the host's Alloy reads (infra/alloy/, k8s/control/secrets/alloy.enc.yaml)
apiVersion: v1
kind: Namespace
metadata:
  name: jarvis2-obs
  labels: { pod-security.kubernetes.io/enforce: restricted, jarvis2/ns: obs }
---
# every control-plane pod names it: under memory pressure the scheduler and the kubelet put these first
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata: { name: jarvis2-control }
value: 1000000000
preemptionPolicy: PreemptLowerPriority
globalDefault: false
description: "Jarvis 2's control plane: core, router, cloudflared"
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: flux-applier, namespace: flux-system }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: flux-applier, namespace: jarvis2-core }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: admin }
subjects: [{ kind: ServiceAccount, name: flux-applier, namespace: flux-system }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: flux-applier, namespace: jarvis2-kernel }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: admin }
subjects: [{ kind: ServiceAccount, name: flux-applier, namespace: flux-system }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: flux-applier, namespace: jarvis2-router }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: admin }
subjects: [{ kind: ServiceAccount, name: flux-applier, namespace: flux-system }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: flux-applier, namespace: jarvis2-edge }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: admin }
subjects: [{ kind: ServiceAccount, name: flux-applier, namespace: flux-system }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: flux-applier, namespace: jarvis2-obs }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: admin }
subjects: [{ kind: ServiceAccount, name: flux-applier, namespace: flux-system }]
---
# two cores (blue and green: the serving one and the next one), 192 Mi requested, 256 Mi at most each
apiVersion: v1
kind: ResourceQuota
metadata: { name: core, namespace: jarvis2-core }
spec:
  hard: { pods: "2", limits.memory: 512Mi, requests.memory: 384Mi, persistentvolumeclaims: "0" }
---
# the kernel (k8s/control/apps/kernel): eight one-replica components (secrets twice, blue and green), three with a 1 Gi state volume
apiVersion: v1
kind: ResourceQuota
metadata: { name: kernel, namespace: jarvis2-kernel }
spec:
  hard: { pods: "9", limits.memory: 896Mi, requests.memory: 320Mi, persistentvolumeclaims: "3", requests.storage: 3Gi }
---
# the router: one, plus a rollout's surge pod (the standby that takes over), 512 Mi requested, 1 Gi at most each
apiVersion: v1
kind: ResourceQuota
metadata: { name: router, namespace: jarvis2-router }
spec:
  hard: { pods: "2", limits.memory: 2Gi, requests.memory: 1Gi, persistentvolumeclaims: "1", requests.storage: 20Gi }
---
# cloudflared: two connectors and the rollout's surge, 128 Mi each
apiVersion: v1
kind: ResourceQuota
metadata: { name: edge, namespace: jarvis2-edge }
spec:
  hard: { pods: "3", limits.memory: 384Mi, requests.memory: 384Mi, persistentvolumeclaims: "0" }
---
apiVersion: v1
kind: ResourceQuota
metadata: { name: obs, namespace: jarvis2-obs }
spec:
  hard: { pods: "0" }
