# TEMPORARY (2026-10-15): can the private Network reach the old box's router NodePorts? curl every 20 s, logs to Grafana
apiVersion: apps/v1
kind: Deployment
metadata: { name: netprobe, namespace: jarvis2-poc }
spec:
  replicas: 1
  selector: { matchLabels: { app: netprobe } }
  template:
    metadata: { labels: { app: netprobe } }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: probe
          image: docker.io/curlimages/curl:8.11.1@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69
          command: [sh, -c, 'while true; do for u in http://10.77.0.9:30082/move/files http://10.77.0.9:30080/ http://10.77.0.2:30080/; do echo "$(date -u +%T) $u $(curl -s -o /dev/null -m 8 -w "%{http_code} %{time_total}" $u)"; done; sleep 20; done']
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { cpu: 100m, memory: 32Mi } }
          securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] }, seccompProfile: { type: RuntimeDefault } }
