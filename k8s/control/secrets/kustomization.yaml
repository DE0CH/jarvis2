# The control box's SOPS-encrypted Secrets (only data/stringData; to keys/control-age.pub), decrypted by its Flux
# with the box's age key. Written by infra/router-secrets.py --box control. Nothing here can reach a code push.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - router.enc.yaml
  - router-github.enc.yaml
  - router-flyorgs.enc.yaml
  - router-flypersonal.enc.yaml
  - router-browserbase.enc.yaml
  - router-move.enc.yaml
  - alloy.enc.yaml
  - router-backup.enc.yaml
  - router-flyvolumes.enc.yaml
