# The kernel on the CONTROL box (DESIGN "Target design", docs/PLAN-grants.md): eight small components, one binary
# each from ghcr.io/de0ch/jarvis2-kernel, each its own Deployment so a bug in one can't read another's memory. Not
# applied yet: Flux syncs this path only from a control box whose bootstrap has the jarvis2-kernel namespace, its
# quota, the flux-applier RoleBinding and the kernel-box-key Secret (k8s/bootstrap-control, infra/cloud-init.sh,
# k8s/flux/control.yaml), i.e. the next rebuilt or moved control box.
# State: the notary's log, the notarizer's sources and the spawner's machines live on their own volumes (Recreate:
# one writer; the router retries a kernel call through the seconds a restart takes). Mover, merger and the two signers
# hold nothing. Secrets holds the stores in memory only, so it runs blue and green like the old cores: one serves (the
# router's state, kernelSecrets), the other is next; a release goes only into the next (active-secrets.txt names the
# serving one for the pin job), Deyao Recovers it alongside and the router flips (router/kernel.go).
# Only the router reaches them; only the spawner (Fly) and secrets (GitHub deploy keys) reach the internet. The image is
# pinned by digest by the images workflow's pin job whenever kernel/ changed.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: notary-data, namespace: jarvis2-kernel }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: notary, namespace: jarvis2-kernel }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: kernel, role: notary } }
  template:
    metadata: { labels: { app: kernel, role: notary, egress: "none" } }
    spec:
      priorityClassName: jarvis2-control
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: notary
          image: ghcr.io/de0ch/jarvis2-kernel:sha-b9f205103266@sha256:97cd3e4c9c7e1ada86e8b818475e7f16c29c73608dfc3a8386ab8d6cc89c8cb9
          command: ["/kernel/notary"]
          ports: [{ containerPort: 8080 }]
          env: [{ name: KERNEL_BOX_KEY, value: /box/box-key.pem }, { name: KERNEL_DATA, value: /data }]
          volumeMounts: [{ name: box-key, mountPath: /box, readOnly: true }, { name: data, mountPath: /data }]
          resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 64Mi } }
          securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] }, seccompProfile: { type: RuntimeDefault } }
      securityContext: { fsGroup: 65532 }
      volumes: [{ name: box-key, secret: { secretName: kernel-box-key, defaultMode: 0440 } }, { name: data, persistentVolumeClaim: { claimName: notary-data } }]
---
apiVersion: v1
kind: Service
metadata: { name: notary, namespace: jarvis2-kernel }
spec:
  selector: { app: kernel, role: notary }
  ports: [{ port: 8080, targetPort: 8080 }]
---
